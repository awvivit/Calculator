<!DOCdata-type html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="./style.css" rel="stylesheet" >
    <script src="./script.js" data-type="text/javascript" ></script>
</head>
<body>
    <div id="calculator">
        <div id="screen_container"> 
            <div id="screen">

            </div>
            <div id="error"></div>
        </div>
        <div id="keypad_container">
            <div id="num_pad" class="keypad">
                <div class="button" data-type="numeral">7</div>
                <div class="button" data-type="numeral">8</div>
                <div class="button" data-type="numeral">9</div>
                <div class="button" data-type="numeral">4</div>
                <div class="button" data-type="numeral">5</div>
                <div class="button" data-type="numeral">6</div>
                <div class="button" data-type="numeral">1</div>
                <div class="button" data-type="numeral">2</div>
                <div class="button" data-type="numeral">3</div>
                <div class="button" data-type="allclear">AC</div>
                <div class="button" data-type="numeral">0</div>
                <div class="button" data-type="decimal">.</div>
                <div class="button" data-type="clear">CE</div>
                <div class="button" data-type="null">&nbsp;</div>
                <div class="button" data-type="null">&nbsp;</div>
            </div>
            <div class="controls" id="control_pad">
                
                <div class="button" data-type="operator">+</div>
                <div class="button" data-type="operator">-</div>
                <div class="button" data-type="operator">*</div>
                <div class="button" data-type="operator">/</div>
                <div class="button" data-type="operator">=</div>
            </div>
        </div>
    </div>
    <script type="text/javascript"> 
        window.calc1 = new window.calculator('#calculator');
    </script>
</body>
</html>
